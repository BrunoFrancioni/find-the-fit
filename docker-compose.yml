services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: find_the_fit_vector_db
    ports:
      - "6333:6333" # REST API & Web UI Dashboard
      - "6334:6334" # gRPC API (used by high-performance clients)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true

  redis:
    image: redis:7-alpine
    container_name: find_the_fit_cache
    ports:
      - "6379:6379"

volumes:
  qdrant_storage: